<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header ng-primary text=white">
                <h3 class="text-center">student registration form</h3>
            </div>
            <div class="card-body">
                <form action="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">
                            please enter your full name
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">
                            please enter your Roll Number
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <input type="email" class="form-control"
                            placeholder="enter email"required>
                            <div class="invalid-feedback">enter a valid email address</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text">+91</span>
                            <input type="tel" class="form-control"
                            pattern="[0-9]{10}"required>
                            <div class="invalid-feedback">enter a valid phone Number</div>
                        </div>
                    </div>
                    <div class="md-3">
                    <label class="form label d-block">gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender"required>
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender"required>
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender"required>
                        <label class="form-check-label">other</label>
                    </div>
                </div>
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" required>
                            <option value="choose Branch"></option>
                                <option>CSE</option>
                                <option>ECE</option>
                                <option>EEE</option>
                                <option>Mechanical</option>
                                <option>Civil</option>
                        </select>
                        <div class="invalid-feedback">
                            please select a branch
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">data of birth</label>
                        <input type="date" class="form-control" required>
                        <div class="invalid-feedback">
                            please select date of birth
                        </div>
                    </div>
                    <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control"
                              rows="4" required></textarea>

                    <div class="invalid-feedback">
                        Please enter your address.
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">upload photo</label>
                    <input type="file" class="form-control"required>
                    <div class="invalid-feedback">please upload photo</div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" required>
                    <label class="form-check-label">
                        i agree for terms and conditions
                    </label>
                    <div class="invalid-feedback">you must accept terms</div>
                </div>
                    <button type="submit"
                        class="btn btn-primary">
                    Register
                </button>

                <button type="reset"
                        class="btn btn-secondary">
                    Reset
                </button>
                </form>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
