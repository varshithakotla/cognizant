<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2 class="text-center text-primary mb-4">Student Registration Form</h2>

    <form onsubmit="showAlert(event)">
        
        <!-- Student Name -->
        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
        </div>

        <!-- Mobile Number -->
        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" pattern="[0-9]{10}" required>
        </div>

        <!-- Gender -->
        <div class="mb-3">
            <label class="form-label">Gender</label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" required>
                <label class="form-check-label">Male</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender">
                <label class="form-check-label">Female</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender">
                <label class="form-check-label">Other</label>
            </div>
        </div>

        <!-- Course Selection -->
        <div class="mb-3">
            <label class="form-label">Course Selection</label>
            <select class="form-select" required>
                <option value="">Choose Course</option>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Data Science</option>
                <option>AI & Machine Learning</option>
                <option>Cloud Computing</option>
            </select>
        </div>

        <!-- Qualification -->
        <div class="mb-3">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" placeholder="Enter Qualification" required>
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="4" required></textarea>
        </div>

        <!-- Upload Resume -->
        <div class="mb-3">
            <label class="form-label">Upload Resume</label>
            <input type="file" class="form-control" required>
        </div>

        <!-- Terms -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" required>
            <label class="form-check-label">
                I agree to the Terms & Conditions
            </label>
        </div>

        <!-- Success Alert -->
        <div id="successMessage" class="alert alert-success d-none">
            Registration Successful!
        </div>

        <button type="submit" class="btn btn-primary">
            Register
        </button>

    </form>
</div>

<script>
function showAlert(event){
    event.preventDefault();
    document.getElementById("successMessage")
            .classList.remove("d-none");
}
</script>

</body>
</html>
